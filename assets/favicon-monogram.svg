<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="mGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6e191d"/>
      <stop offset="50%" stop-color="#4e0d10"/>
      <stop offset="100%" stop-color="#2d0507"/>
    </linearGradient>
    <linearGradient id="gGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff2c8"/>
      <stop offset="35%" stop-color="#e2a845"/>
      <stop offset="70%" stop-color="#b87b22"/>
      <stop offset="100%" stop-color="#ffd772"/>
    </linearGradient>
    <filter id="glow">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Rich Royal Maroon Squircle Tile -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#mGrad)" stroke="url(#gGrad)" stroke-width="2.5"/>
  <rect x="5.5" y="5.5" width="53" height="53" rx="11" fill="none" stroke="#e2a845" stroke-width="0.8" opacity="0.6"/>

  <!-- Monogram text P & H in luxury serif -->
  <g filter="url(#glow)">
    <text x="32" y="41" font-family="'Playfair Display', 'Cinzel', Georgia, serif" font-size="24" font-weight="700" fill="url(#gGrad)" text-anchor="middle" letter-spacing="1">P&amp;H</text>
  </g>
  <!-- Tiny delicate diamond crown motif above -->
  <polygon points="32,13 34.5,17 32,20 29.5,17" fill="#ffffff" opacity="0.9"/>
  <circle cx="25" cy="17" r="1" fill="#ffd772"/>
  <circle cx="39" cy="17" r="1" fill="#ffd772"/>
</svg>
