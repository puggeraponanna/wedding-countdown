<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="mGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6e191d"/>
      <stop offset="50%" stop-color="#4e0d10"/>
      <stop offset="100%" stop-color="#2d0507"/>
    </linearGradient>
    <linearGradient id="gGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff5d0"/>
      <stop offset="25%" stop-color="#f3b84f"/>
      <stop offset="65%" stop-color="#c48524"/>
      <stop offset="100%" stop-color="#ffe188"/>
    </linearGradient>
    <linearGradient id="gemGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#e3f6fc"/>
      <stop offset="100%" stop-color="#9ce6f9"/>
    </linearGradient>
    <filter id="shadow2">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#mGrad2)" stroke="url(#gGrad2)" stroke-width="2.5"/>
  <rect x="5.5" y="5.5" width="53" height="53" rx="11" fill="none" stroke="#e2a845" stroke-width="0.75" opacity="0.6"/>

  <g filter="url(#shadow2)">
    <!-- Right Ring -->
    <circle cx="39" cy="35" r="13.5" fill="none" stroke="url(#gGrad2)" stroke-width="4.5"/>
    
    <!-- Left Ring -->
    <circle cx="25" cy="35" r="13.5" fill="none" stroke="url(#gGrad2)" stroke-width="4.5"/>

    <!-- Overlap weave to give true 3D interlocking depth -->
    <path d="M 28 23.5 A 13.5 13.5 0 0 1 38.5 28" fill="none" stroke="url(#gGrad2)" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Solitaire Diamond Crown atop Left Ring -->
    <polygon points="25,12 30,18.5 25,23.5 20,18.5" fill="url(#gemGrad2)" stroke="#ffffff" stroke-width="0.75"/>
    <polygon points="25,12 28,18.5 25,23.5 22,18.5" fill="#ffffff" opacity="0.6"/>

    <!-- Sparkle rays -->
    <circle cx="25" cy="18" r="1.5" fill="#ffffff"/>
    <line x1="25" y1="8" x2="25" y2="10.5" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="15" y1="18" x2="17.5" y2="18" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="32.5" y1="18" x2="35" y2="18" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>
